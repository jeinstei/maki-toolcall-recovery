# Manifest for the maki package, read only on the packaged path. Loaded by
# symlink into ~/.config/maki/lua/ instead, a config dir's own plugin.toml
# governs and this file is not consulted.

min_maki_version = "0.7.0"

# A layer on any `agent.*` slot is priced at every permission, and a layer
# missing one is dropped from the chain, so the full set is required. The code
# only reads `value.last_message` and returns a `continue` string.
[permissions]
fs_read = true
fs_write = true
net = true
run = true
env = true
agent = true
session_read = true
session_write = true
session_settings = true
input = true

# Options (max_retries, instrument) are not read here. Set them from Lua; the
# `load` function runs as the package owner, so require() resolves inside the
# package sandbox. The loader applies to every spec in its pack.add call, so
# give this package its own call:
#
#   maki.pack.add({ { src = "https://github.com/jeinstei/maki-toolcall-recovery" } }, {
#     load = function(package)
#       require("toolcall_recovery").setup({ instrument = true })
#     end,
#   })
